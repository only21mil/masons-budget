<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Locked-down CSP. The renderer loads no remote code, no remote styles, and
      makes no network connections of its own — all data arrives through the
      preload bridge from the main process.

      No frame-ancestors: it is ignored when delivered via <meta> and only works
      as an HTTP header, so it bought nothing here. Embedding is blocked by
      frame-src/child-src plus the main process refusing webviews and popups.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'; object-src 'none'"
    />
    <title>The Vogel Vault</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
