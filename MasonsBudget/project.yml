name: MasonsBudget
options:
  bundleIdPrefix: com.sats21m
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"

targets:
  MasonsBudget:
    type: application
    platform: iOS
    sources:
      - path: MasonsBudget
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MasonsBudget/Resources/Assets.xcassets
      - path: MasonsBudget/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Mason's Budget"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Voice input lets you log transactions by speaking."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is needed for voice transaction entry."
        # CODE_SIGN_ENTITLEMENTS will be added back when iCloud provisioning is set up
        # CODE_SIGN_ENTITLEMENTS: MasonsBudget/MasonsBudget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "8KN6X3FLPZ"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    dependencies: []

  MasonsBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasonsBudgetTests
        excludes:
          - "**/.DS_Store"
      - path: MasonsBudget
        excludes:
          - "App/MasonsBudgetApp.swift"
          - "Preview Content/**"
          - "Resources/**"
          - "**/.DS_Store"
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MasonsBudget:
    build:
      targets:
        MasonsBudget: all
        MasonsBudgetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MasonsBudgetTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
