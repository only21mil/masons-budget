name: MasonsBudget
options:
  bundleIdPrefix: com.sats21m
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 23
    MARKETING_VERSION: "0.4.0"

targets:
  MasonsBudget:
    type: application
    platform: iOS
    sources:
      - path: MasonsBudget
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MasonsBudget/Resources/Assets.xcassets
      - path: MasonsBudget/Preview Content
    info:
      path: MasonsBudget/Info-iOS.plist
      properties:
        CFBundleDisplayName: The Vogel Vault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        NSSpeechRecognitionUsageDescription: Voice input lets you log transactions by speaking.
        NSMicrophoneUsageDescription: Microphone access is needed for voice transaction entry.
        NSFaceIDUsageDescription: Unlock The Vogel Vault with Face ID.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INAlternativeAppNames:
          - INAlternativeAppName: Budget App
          - INAlternativeAppName: Todo List App
          - INAlternativeAppName: Vault
          - INAlternativeAppName: Vogel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: MasonsBudget/MasonsBudget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "384ZGKG4GB"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    dependencies: []

  MasonsBudgetMac:
    type: application
    platform: macOS
    sources:
      - path: MasonsBudget
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MasonsBudget/Resources/Assets.xcassets
      - path: MasonsBudget/Preview Content
    info:
      path: MasonsBudget/Info-macOS.plist
      properties:
        CFBundleDisplayName: The Vogel Vault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        NSSpeechRecognitionUsageDescription: Voice input lets you log transactions by speaking.
        NSMicrophoneUsageDescription: Microphone access is needed for voice transaction entry.
        NSFaceIDUsageDescription: Unlock The Vogel Vault with Face ID.
        ITSAppUsesNonExemptEncryption: false
        INAlternativeAppNames:
          - INAlternativeAppName: Budget App
          - INAlternativeAppName: Todo List App
          - INAlternativeAppName: Vault
          - INAlternativeAppName: Vogel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget
        CODE_SIGN_ENTITLEMENTS: MasonsBudget/MasonsBudgetMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "384ZGKG4GB"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    dependencies: []

  MasonsBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasonsBudgetTests
        excludes:
          - "**/.DS_Store"
      - path: MasonsBudget
        excludes:
          - "App/MasonsBudgetApp.swift"
          - "Preview Content/**"
          - "Resources/**"
          - "**/.DS_Store"
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "384ZGKG4GB"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  MasonsBudget:
    build:
      targets:
        MasonsBudget: all
        MasonsBudgetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MasonsBudgetTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MasonsBudgetMac:
    build:
      targets:
        MasonsBudgetMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
