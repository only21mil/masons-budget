name: MasonsBudget
options:
  bundleIdPrefix: com.sats21m
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 42
    MARKETING_VERSION: "0.5.0"

targets:
  MasonsBudget:
    type: application
    platform: iOS
    sources:
      - path: MasonsBudget
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MasonsBudget/Resources/Assets.xcassets
      - path: MasonsBudget/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "The Vogel Vault"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Voice input lets you log transactions by speaking."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is needed for voice transaction entry."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock The Vogel Vault with Face ID."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        CODE_SIGN_ENTITLEMENTS: MasonsBudget/MasonsBudget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "384ZGKG4GB"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
    # SAT-1508 — DO NOT replace this info block with INFOPLIST_KEY_MC2BundledPairingURLsB64.
    # Xcode silently ignores custom (non-allowlisted) INFOPLIST_KEY_* settings; that is the
    # exact reason build 37 shipped WITHOUT pairing slots. Verified on the build-38 archives:
    # INFOPLIST_KEY_ variant -> key absent; this info block -> key present (PlistBuddy gate).
    # Xcode expands $(MC2_BUNDLED_PAIRING_URLS_B64) from the archive CLI and merges the
    # INFOPLIST_KEY_* values above into the generated file.
    info:
      path: Config/Info-iOS-generated.plist
      properties:
        MC2BundledPairingURLsB64: "$(MC2_BUNDLED_PAIRING_URLS_B64)"
    dependencies: []

  MasonsBudgetMac:
    type: application
    platform: macOS
    sources:
      - path: MasonsBudget
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MasonsBudget/Resources/Assets.xcassets
      - path: MasonsBudget/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget
        CODE_SIGN_ENTITLEMENTS: MasonsBudget/MasonsBudgetMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "384ZGKG4GB"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "The Vogel Vault"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Voice input lets you log transactions by speaking."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access is needed for voice transaction entry."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock The Vogel Vault with Face ID."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
    # SAT-1508: see iOS target note — custom keys require the info block, not INFOPLIST_KEY_*.
    info:
      path: Config/Info-macOS-generated.plist
      properties:
        MC2BundledPairingURLsB64: "$(MC2_BUNDLED_PAIRING_URLS_B64)"
    dependencies: []

  MasonsBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasonsBudgetTests
        excludes:
          - "**/.DS_Store"
      - path: MasonsBudget
        excludes:
          - "App/MasonsBudgetApp.swift"
          - "Preview Content/**"
          - "Resources/**"
          - "**/.DS_Store"
      - path: ../shared/domain/fixtures
        group: shared/domain
        createIntermediateGroups: false
        buildPhase: resources
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MasonsBudget:
    build:
      targets:
        MasonsBudget: all
        MasonsBudgetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MasonsBudgetTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MasonsBudgetMac:
    build:
      targets:
        MasonsBudgetMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
