name: MasonsBudget
options:
  bundleIdPrefix: com.sats21m
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 48
    MARKETING_VERSION: "0.5.0"
    # Compatibility input for existing archive automation. New callers should
    # pass VOGEL_VAULT_BUNDLED_PAIRING_URLS_B64 directly.
    VOGEL_VAULT_BUNDLED_PAIRING_URLS_B64: "$(MC2_BUNDLED_PAIRING_URLS_B64)"

targets:
  MasonsBudget:
    type: application
    platform: iOS
    sources:
      - path: MasonsBudget
        excludes:
          - "**/.DS_Store"
          - "Views/Components/AppleScreenAdoption.swift"
          - "Views/Screens/BitcoinOverviewView.swift"
          - "Views/Screens/FamilySettingsAwardsViews.swift"
      - path: MasonsBudget/Views/Components/AppleScreenAdoption.swift
      - path: MasonsBudget/Views/Screens/BitcoinOverviewView.swift
      - path: MasonsBudget/Views/Screens/FamilySettingsAwardsViews.swift
    resources:
      - path: MasonsBudget/Resources/Assets.xcassets
      - path: MasonsBudget/Resources/Fonts
      - path: MasonsBudget/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "The Vogel Vault"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock The Vogel Vault with Face ID."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        CODE_SIGN_ENTITLEMENTS: MasonsBudget/MasonsBudget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "384ZGKG4GB"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    # SAT-1508 — custom keys must use this info block, not INFOPLIST_KEY_*.
    # Xcode silently ignores custom (non-allowlisted) INFOPLIST_KEY_* settings; that is the
    # exact reason build 37 shipped WITHOUT pairing slots. Verified on the build-38 archives:
    # INFOPLIST_KEY_ variant -> key absent; this info block -> key present (PlistBuddy gate).
    # Xcode expands the pairing payload from the archive CLI and merges the
    # INFOPLIST_KEY_* values above into the generated file.
    info:
      path: Config/Info-iOS-generated.plist
      properties:
        VogelVaultBundledPairingURLsB64: "$(VOGEL_VAULT_BUNDLED_PAIRING_URLS_B64)"
        UIAppFonts:
          - SourceCodePro-Light.ttf
          - SourceCodePro-Regular.ttf
          - SourceCodePro-Medium.ttf
          - SourceCodePro-Semibold.ttf
          - SourceCodePro-Bold.ttf
    dependencies: []

  MasonsBudgetMac:
    type: application
    platform: macOS
    sources:
      - path: MasonsBudget
        excludes:
          - "**/.DS_Store"
          - "Views/Components/AppleScreenAdoption.swift"
          - "Views/Screens/BitcoinOverviewView.swift"
          - "Views/Screens/FamilySettingsAwardsViews.swift"
      - path: MasonsBudget/Views/Components/AppleScreenAdoption.swift
      - path: MasonsBudget/Views/Screens/BitcoinOverviewView.swift
      - path: MasonsBudget/Views/Screens/FamilySettingsAwardsViews.swift
    resources:
      - path: MasonsBudget/Resources/Assets.xcassets
      - path: MasonsBudget/Resources/Fonts
      - path: MasonsBudget/Preview Content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget
        CODE_SIGN_ENTITLEMENTS: MasonsBudget/MasonsBudgetMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "384ZGKG4GB"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "The Vogel Vault"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock The Vogel Vault with Face ID."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
    # SAT-1508: see iOS target note — custom keys require the info block, not INFOPLIST_KEY_*.
    info:
      path: Config/Info-macOS-generated.plist
      properties:
        VogelVaultBundledPairingURLsB64: "$(VOGEL_VAULT_BUNDLED_PAIRING_URLS_B64)"
        ATSApplicationFontsPath: "."
    dependencies: []

  MasonsBudgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MasonsBudgetTests
        excludes:
          - "**/.DS_Store"
          - "AppleScreenAdoptionTests.swift"
      - path: MasonsBudgetTests/AppleScreenAdoptionTests.swift
      - path: MasonsBudget
        excludes:
          - "App/MasonsBudgetApp.swift"
          - "Preview Content/**"
          - "Resources/**"
          - "**/.DS_Store"
          - "Views/Components/AppleScreenAdoption.swift"
          - "Views/Screens/BitcoinOverviewView.swift"
          - "Views/Screens/FamilySettingsAwardsViews.swift"
      - path: MasonsBudget/Views/Components/AppleScreenAdoption.swift
      - path: MasonsBudget/Views/Screens/BitcoinOverviewView.swift
      - path: MasonsBudget/Views/Screens/FamilySettingsAwardsViews.swift
      - path: ../shared/domain/fixtures
        group: shared/domain
        createIntermediateGroups: false
        buildPhase: resources
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget.tests
        GENERATE_INFOPLIST_FILE: YES

  MasonsBudgetMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MasonsBudgetTests/AppleScreenAdoptionTests.swift
      - path: MasonsBudget
        excludes:
          - "App/MasonsBudgetApp.swift"
          - "Preview Content/**"
          - "Resources/**"
          - "**/.DS_Store"
      - path: ../shared/domain/fixtures
        group: shared/domain
        createIntermediateGroups: false
        buildPhase: resources
    resources:
      - path: MasonsBudget/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sats21m.masonsbudget.mac-design-packet-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAC_DESIGN_PACKET"

schemes:
  MacDesignPacket:
    build:
      targets:
        MasonsBudgetMacTests: [test]
    test:
      config: Debug
      targets:
        - MasonsBudgetMacTests
      environmentVariables:
        MAC_DESIGN_PACKET_DIR: "$(MAC_DESIGN_PACKET_DIR)"
  MasonsBudget:
    build:
      targets:
        MasonsBudget: all
        MasonsBudgetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MasonsBudgetTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MasonsBudgetMac:
    build:
      targets:
        MasonsBudgetMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
