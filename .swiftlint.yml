disabled_rules:
  - trailing_comma
  - opening_brace
  - statement_position
  # Baseline legacy debt so DGX preflight can catch regressions without
  # requiring a broad app refactor before every code-only lane.
  - cyclomatic_complexity
  - file_length
  - for_where
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - non_optional_string_data_conversion
  - shorthand_operator
  - type_body_length

opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - redundant_nil_coalescing
  - private_outlet

excluded:
  - MasonsBudgetTests
  - drafts
  - .build
  - .claude
  - .serena
  - DerivedData
  - node_modules

function_body_length: 80
