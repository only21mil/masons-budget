name: Buzz iOS preserved artifact signing recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: buzz-ios-testflight-release
  cancel-in-progress: false

jobs:
  sign-upload:
    if: github.repository == 'only21mil/masons-budget'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SOURCE_SHA: 038e8ae4f33387f2b5a299c1af54b1a4404c5f94
      VERSION: 0.5.9
      BUILD_NUMBER: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Require a separate GitHub-hosted signing VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - name: Verify the original successful unsigned build and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_recovery.py provenance
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '10065006053'
          run-id: '34247966654'
          github-token: ${{ github.token }}
          path: unsigned
      - name: Validate and extract inert app before credentials exist
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_recovery.py prepare
      - name: Check the exact ASC app and reject used build numbers
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          node .github/workflows/scripts/buzz_ios_asc.mjs available
          --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Sign parent and extension with their exact App Store profiles
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUZZ_IOS_APP_STORE_PROFILE: ${{ secrets.BUZZ_IOS_APP_STORE_PROFILE }}
          BUZZ_IOS_NSE_APP_STORE_PROFILE: ${{ secrets.BUZZ_IOS_NSE_APP_STORE_PROFILE }}
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_recovery.py sign
      - name: Preserve verified IPA before network upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-ios-recovered-signed-${{ github.run_id }}
          path: signed-ios/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact verified IPA through retained ASC credential
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_recovery.py upload
      - name: Verify Apple processing for the exact uploaded build
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          node .github/workflows/scripts/buzz_ios_asc.mjs processed
          --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Always remove temporary signing material and keychain
        if: always()
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_recovery.py cleanup
      - name: Preserve upload receipt after cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-ios-recovery-receipts-${{ github.run_id }}
          path: |
            signed-ios/upload.json
            signed-ios/asc-*.json
            signed-ios/ios-release.json
            signed-ios/recovery-events.jsonl
            ios-recovery-provenance.json
          if-no-files-found: warn
          retention-days: 30
