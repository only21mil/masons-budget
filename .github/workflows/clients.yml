name: Clients CI

# Builds and verifies the shared domain contract, the Convex backend functions,
# and the Linux and Android clients on GitHub runners so no toolchain has to be
# installed on a workstation. The Ubuntu runner ships the Android SDK with
# licences already accepted, which is why the Android job needs no interactive
# gate.
#
# This workflow never touches the live Convex deployment, never signs anything,
# and never publishes a distributable app artifact. Signed Android APKs stay in
# android-read-bootstrap.yml behind its manual trigger; Apple builds stay in
# deploy.yml behind their own manual trigger.

on:
  # main is included deliberately: it was previously excluded to avoid duplicate
  # push+PR runs, which meant the default branch was never verified after a
  # merge. Concurrency below handles the duplication instead.
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which trees actually changed. Added 2026-07-27 after a session of ~30 PRs
  # exhausted the account's Actions minutes: every PR ran all four jobs, so a
  # docs-only change still assembled an APK, installed Chromium and captured a
  # design packet. Cost is not the only reason — a job that cannot be affected
  # by a diff tells you nothing when it passes.
  #
  # A push to main always reports every tree as changed. The default branch must
  # be verified whole after a merge, which is the property the trigger comment
  # above is protecting; scoping must not quietly undo it.
  changes:
    name: Detect changed trees
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare against the merge base
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          verify_all() {
            echo "::notice::$1"
            for t in linux android backend tooling; do echo "$t=true" >> "$GITHUB_OUTPUT"; done
          }

          diff_base=""
          diff_head=HEAD
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
              [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              diff_base="$BEFORE_SHA"
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF:-main}"
            git fetch -q origin "${BASE_REF:-main}"
            diff_base="$(git merge-base HEAD "$base")"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            if [[ ! "$MERGE_GROUP_BASE_SHA" =~ ^[0-9a-f]{40}$ ||
              ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              verify_all "Merge-group SHAs are missing or malformed; verifying every tree."
              exit 0
            fi
            if ! git cat-file -e "${MERGE_GROUP_BASE_SHA}^{commit}" ||
              ! git cat-file -e "${HEAD_SHA}^{commit}"; then
              verify_all "Merge-group comparison commit is unavailable; verifying every tree."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$MERGE_GROUP_BASE_SHA" "$HEAD_SHA"; then
              verify_all "Merge-group base is not an ancestor of its head; verifying every tree."
              exit 0
            fi
            diff_base="$MERGE_GROUP_BASE_SHA"
            diff_head="$HEAD_SHA"
          fi

          if [ -n "$diff_base" ]; then
            scripts/check-convex-generated-change.sh "$diff_base" "$diff_head"
          else
            echo "No meaningful commit range; skipping the Convex generated-file heuristic."
          fi

          if [ "$IS_MAIN_PUSH" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            verify_all "Verifying every tree (main push or manual dispatch)."
            exit 0
          fi

          if ! files="$(git diff --name-only "$diff_base" "$diff_head")"; then
            verify_all "Comparison range could not be diffed; verifying every tree."
            exit 0
          fi
          printf '%s\n' "$files" | sed 's/^/  /'

          # shared/, convex/ and the workflow itself reach every client, so they
          # mark every detected tree. Erring toward running a job is the safe direction:
          # a needless run costs minutes, a skipped one costs a regression.
          wide=false
          printf '%s\n' "$files" | grep -qE '^(shared/|convex/|package(-lock)?\.json|\.github/workflows/clients\.yml)' && wide=true

          # A job's own tooling is part of that job even though it lives outside
          # the client source tree. Keep this map job-specific: the other
          # workflow scripts belong to the always-on lint gate or manual release
          # preflights, so they must not spend Linux or Android client minutes.
          declare -A job_paths=(
            [linux]='^linux/'
            [android]='^(android/|\.github/workflows/scripts/(verify_android_design_packet\.py|tests/test_verify_android_design_packet\.py)$)'
            [tooling]='^(\.github/workflows/android-read-bootstrap\.yml|android/app/build\.gradle\.kts|scripts/((build-android-read-bootstrap|mint-(android-read-bootstrap|linux-device-pairing|mobile-pairing-slots))\.mjs|tests/(build-android-read-bootstrap|mint-(android-read-bootstrap|linux-device-pairing|mobile-pairing-slots))\.test\.mjs))$'
          )

          for t in linux android tooling; do
            if [ "$wide" = true ] || printf '%s\n' "$files" | grep -qE "${job_paths[$t]}"; then
              echo "$t=true" >> "$GITHUB_OUTPUT"
            else
              echo "$t=false" >> "$GITHUB_OUTPUT"
            fi
          done
          # The contract and Convex suites are cheap and guard the money rules;
          # they run whenever anything at all changed.
          echo "backend=true" >> "$GITHUB_OUTPUT"

  credential-tooling:
    name: Credential mint tooling
    needs: changes
    # A detector failure runs this small test set. Skipping credential checks is
    # never the safe fallback.
    if: >-
      always() &&
      github.repository == 'only21mil/masons-budget' &&
      (needs.changes.result != 'success' || needs.changes.outputs.tooling == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # These tests use injected fetch implementations or --dry-run. The job
      # binds no repository secrets and cannot mint a live credential.
      - name: Credential mint tests
        run: >-
          node --test
          scripts/tests/mint-android-read-bootstrap.test.mjs
          scripts/tests/build-android-read-bootstrap.test.mjs
          scripts/tests/mint-linux-device-pairing.test.mjs
          scripts/tests/mint-mobile-pairing-slots.test.mjs

  shared-domain:
    name: Shared domain contract
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @vogel-vault/domain

      - name: Parity tests against the Swift contract
        run: npm run test --workspace @vogel-vault/domain

  # Synthetic response bodies in the committed wire-shape fixture set, replayed
  # through the same repositories the shipped clients call. No socket or
  # credential is involved. This runs on every PR rather than following client
  # path filters: a committed fixture, transport setting, or shared wire
  # assumption can invalidate both clients even when neither client tree changed.
  # The synthetic-content guard keeps production-shaped values out of the
  # fixtures (they replaced verbatim production captures in 2026-09).
  convex-wire-golden:
    name: Convex wire golden decoders
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fixture synthetic-content guard
        run: node scripts/check-convex-wire-golden-synthetic.mjs

      - name: Fixture provenance and Linux values
        run: node scripts/check-convex-wire-golden-provenance.mjs

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21

      # v5.0.2 is the latest Node 24 open-source release. v6 changes the
      # caching implementation's license and behavior, so it needs a separate
      # legal and technical review before adoption.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Linux wire decoder
        run: npx vitest run test/convex-wire-golden.test.ts
        working-directory: linux

      - name: Android wire decoder
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests 'com.sats21m.vogelvault.data.ConvexWireGolden*Test'
          --no-daemon
        working-directory: android

  # A peer of shared-domain rather than a dependant of it. The Convex functions
  # import nothing from @vogel-vault/domain, so gating them behind the contract
  # job would only serialise two runs that have no reason to wait on each other.
  #
  # This is the layer that was publicly readable until the read token landed, so
  # its auth tests are the ones that most need to run on every push — they were
  # written in #18 but had no job to run in, because this file belonged to
  # another agent that wave.
  convex-functions:
    name: Convex functions
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Root install: convex-test, vitest and @edge-runtime/vm are root
      # devDependencies. Generated Convex declarations are committed, so no
      # codegen or authenticated deployment is needed here.
      - run: npm ci

      - name: Verify committed Convex generated types
        run: |
          git ls-files --error-unmatch \
            convex/_generated/api.d.ts \
            convex/_generated/dataModel.d.ts \
            convex/schema.sha256 \
            convex/_generated/server.d.ts

      - name: Typecheck deployable Convex functions
        run: npx tsc --noEmit -p convex/tsconfig.json

      - name: Typecheck Convex tests
        run: npx tsc --noEmit -p convex/tsconfig.test.json

      - name: Read/mutation auth and todo LWW tests
        run: npm run convex:test

  linux-client:
    name: Linux client
    needs: [shared-domain, changes]
    # A broken detector is not permission to skip a required client check.
    if: >-
      always() &&
      github.repository == 'only21mil/masons-budget' &&
      needs.shared-domain.result == 'success' &&
      (needs.changes.result != 'success' || needs.changes.outputs.linux == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: linux

      - name: Typecheck electron main/preload
        run: npx tsc --noEmit -p tsconfig.electron.json
        working-directory: linux

      - name: Lint
        run: npx eslint .
        working-directory: linux

      - name: Preload boundary guard
        run: node scripts/qa-preload-boundary.mjs
        working-directory: linux

      - name: Render matrix (20 routes x profiles x states)
        run: npx vitest run
        working-directory: linux

      - name: Build
        run: npm run build --workspace @vogel-vault/linux

      - name: Upload build output
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-client-dist
          path: |
            linux/dist
            linux/dist-electron
          retention-days: 7

      # Design packet: every page at both widths, plus sampled states and the
      # child profile. Headless, so it needs no display. Download the artifact to
      # review the UI without running the app.
      - name: Install Chromium for screenshots
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npx playwright install --with-deps chromium
        working-directory: linux

      - name: Capture design packet
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run screenshots
        working-directory: linux

      - name: Upload design packet
        if: >-
          always() &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-design-packet
          path: linux/screenshots
          retention-days: 30

  android-client:
    name: Android client
    needs: [shared-domain, changes]
    # A broken detector is not permission to skip a required client check.
    if: >-
      always() &&
      github.repository == 'only21mil/masons-budget' &&
      needs.shared-domain.result == 'success' &&
      (needs.changes.result != 'success' || needs.changes.outputs.android == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect which Android modules exist
        id: probe
        run: |
          if [ -f android/settings.gradle.kts ]; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle=false" >> "$GITHUB_OUTPUT"
            echo "::notice::android/ not scaffolded yet — skipping."
          fi
          if [ -f android/app/build.gradle.kts ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::android/app not scaffolded yet — domain module only, no APK."
          fi

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        if: steps.probe.outputs.gradle == 'true'
        with:
          distribution: temurin
          java-version: 21

      # setup-gradle configures caching; the committed, checksummed wrapper owns
      # the Gradle version. The domain module is plain Kotlin/JVM and needs no
      # Android SDK — only the app module does. v5.0.2 is the latest Node 24
      # open-source release; v6 requires separate license/behavior review.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        if: steps.probe.outputs.gradle == 'true'

      # Robolectric's android-all runtimes are resolved by the test JVM rather
      # than Gradle. Cache and prefetch them explicitly, then run Robolectric
      # offline below. A cold runner still needs Maven once, but curl retries
      # transient faults and SHA-512 verification rejects partial/corrupt files.
      - name: Restore Robolectric API 34 and 35 runtimes
        if: steps.probe.outputs.app == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/robolectric-dependencies/android-all-instrumented-15-robolectric-12650502-i7.jar
            ${{ runner.temp }}/robolectric-dependencies/android-all-instrumented-14-robolectric-10818077-i7.jar
          key: robolectric-${{ runner.os }}-android-all-instrumented-15-robolectric-12650502-i7-android-all-instrumented-14-robolectric-10818077-i7

      - name: Prefetch Robolectric API 35 runtime
        if: steps.probe.outputs.app == 'true'
        env:
          ROBOLECTRIC_DEPENDENCY_DIR: ${{ runner.temp }}/robolectric-dependencies
          ROBOLECTRIC_RUNTIME: android-all-instrumented-15-robolectric-12650502-i7.jar
          ROBOLECTRIC_RUNTIME_SHA512: 87bdd0341838f5f630e1ff412ab29cb2f06e0f8cb7751f14679d11b4ee6084873001f8f6a8581ae6e139fa7c9a654b632412827430f984ebecc3c2588674f7e7
          ROBOLECTRIC_RUNTIME_URL: https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7/android-all-instrumented-15-robolectric-12650502-i7.jar
        run: |
          set -euo pipefail
          mkdir -p "$ROBOLECTRIC_DEPENDENCY_DIR"
          runtime_path="$ROBOLECTRIC_DEPENDENCY_DIR/$ROBOLECTRIC_RUNTIME"

          if printf '%s  %s\n' "$ROBOLECTRIC_RUNTIME_SHA512" "$runtime_path" |
            sha512sum --check --status; then
            echo "Using checksum-verified cached $ROBOLECTRIC_RUNTIME."
            exit 0
          fi

          partial_path="${runtime_path}.partial"
          rm -f "$partial_path"
          trap 'rm -f "$partial_path"' EXIT
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 600 \
            --output "$partial_path" \
            "$ROBOLECTRIC_RUNTIME_URL"
          printf '%s  %s\n' "$ROBOLECTRIC_RUNTIME_SHA512" "$partial_path" |
            sha512sum --check
          mv "$partial_path" "$runtime_path"

      - name: Prefetch Robolectric API 34 runtime
        if: steps.probe.outputs.app == 'true'
        env:
          ROBOLECTRIC_DEPENDENCY_DIR: ${{ runner.temp }}/robolectric-dependencies
          ROBOLECTRIC_RUNTIME: android-all-instrumented-14-robolectric-10818077-i7.jar
          ROBOLECTRIC_RUNTIME_SHA512: 7cdc0b1306e7865f1acd25a363073149654caee5b8e278c5ae37ff4724185724eff39f0b0111800b521e640bb28698d9d2e655134a801569a0f07470e7b5f455
          ROBOLECTRIC_RUNTIME_URL: https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/14-robolectric-10818077-i7/android-all-instrumented-14-robolectric-10818077-i7.jar
        run: |
          set -euo pipefail
          mkdir -p "$ROBOLECTRIC_DEPENDENCY_DIR"
          runtime_path="$ROBOLECTRIC_DEPENDENCY_DIR/$ROBOLECTRIC_RUNTIME"

          if printf '%s  %s\n' "$ROBOLECTRIC_RUNTIME_SHA512" "$runtime_path" |
            sha512sum --check --status; then
            echo "Using checksum-verified cached $ROBOLECTRIC_RUNTIME."
            exit 0
          fi

          partial_path="${runtime_path}.partial"
          rm -f "$partial_path"
          trap 'rm -f "$partial_path"' EXIT
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 600 \
            --output "$partial_path" \
            "$ROBOLECTRIC_RUNTIME_URL"
          printf '%s  %s\n' "$ROBOLECTRIC_RUNTIME_SHA512" "$partial_path" |
            sha512sum --check
          mv "$partial_path" "$runtime_path"

      - name: Verify Android builds cannot embed a read credential
        if: steps.probe.outputs.app == 'true'
        run: |
          set -euo pipefail
          injection_marker="ci-build-token-must-never-enter-apk"

          CONVEX_READ_TOKEN="$injection_marker" \
            ./gradlew \
              :app:generateDebugBuildConfig \
              :app:generateReleaseBuildConfig \
              --no-daemon \
              --rerun-tasks

          for variant in debug release; do
            build_config="app/build/generated/source/buildConfig/$variant/com/sats21m/vogelvault/BuildConfig.java"
            test -f "$build_config"
            grep -Fqx '  public static final String CONVEX_READ_TOKEN = "";' "$build_config"
            grep -Fqx '  public static final String CONVEX_READ_BOOTSTRAP_PAIR = "";' "$build_config"

            if grep -Fq "$injection_marker" "$build_config"; then
              echo "::error::Android $variant BuildConfig accepted a build-time read credential."
              exit 1
            fi
          done

          guard_dir="$HOME/work/android-bootstrap-ci-guard"
          guard_file="$guard_dir/pairing.txt"
          mkdir -p "$guard_dir"
          chmod 700 "$guard_dir"
          trap 'rm -f "$guard_file"; rmdir "$guard_dir" 2>/dev/null || true' EXIT
          printf '%s' \
            'android-read-AAAAAAAAAAAAAAAA.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            > "$guard_file"
          chmod 600 "$guard_file"

          if CI=true \
            VOGEL_VAULT_ANDROID_BOOTSTRAP_FILE="$guard_file" \
            ./gradlew \
              :app:generateDebugBuildConfig \
              --no-build-cache \
              --no-configuration-cache \
              --no-daemon; then
            echo "::error::Android CI accepted a local bootstrap input."
            exit 1
          fi
        working-directory: android

      - name: Domain parity tests (shared fixture, no Android SDK)
        if: steps.probe.outputs.gradle == 'true'
        run: ./gradlew :domain:test --no-daemon
        working-directory: android

      # Compile and lint the app without assembling an APK. Distributable
      # Android builds use the separate manual-only workflow.
      - name: Lint Android app
        if: steps.probe.outputs.app == 'true'
        run: ./gradlew :app:lintDebug --no-daemon
        working-directory: android

      # Required PR verification: every app unit test except the screenshot
      # packet. This includes the real Robolectric cache/config tests and runs
      # against prefetched API 34 and 35 runtimes with network resolution
      # disabled.
      - name: Verify declared Robolectric SDK runtimes are prefetched
        if: steps.probe.outputs.app == 'true'
        env:
          ROBOLECTRIC_DEPENDENCY_DIR: ${{ runner.temp }}/robolectric-dependencies
        run: |
          set -euo pipefail
          declare -A runtime_by_sdk=(
            [34]='android-all-instrumented-14-robolectric-10818077-i7.jar'
            [35]='android-all-instrumented-15-robolectric-12650502-i7.jar'
          )

          # grep, not ripgrep: GitHub-hosted runners do not ship rg, and an
          # absent tool made this guard exit 127 and fail the build spuriously.
          scan_status=0
          sdk_declarations="$(
            grep -rhoE \
              'sdk[[:space:]]*=[[:space:]]*\[[^]]+\]' \
              android/app/src/test
          )" || scan_status=$?
          if [ "$scan_status" -gt 1 ]; then
            echo "::error::Could not scan app tests for Robolectric SDK declarations."
            exit "$scan_status"
          fi

          mapfile -t declared_sdks < <(
            printf '%s\n' "$sdk_declarations" |
              sed -E 's/^[^[]*\[([^]]+)\].*$/\1/' |
              tr ',' '\n' |
              sed -E 's/^[[:space:]]+|[[:space:]]+$//g' |
              sed '/^$/d' |
              sort -u
          )

          for sdk in "${declared_sdks[@]}"; do
            if [[ ! "$sdk" =~ ^[0-9]+$ ]]; then
              echo "::error::Cannot verify non-numeric Robolectric SDK declaration '$sdk'; add an explicit warmed runtime mapping."
              exit 1
            fi

            runtime="${runtime_by_sdk[$sdk]:-}"
            if [ -z "$runtime" ]; then
              echo "::error::Robolectric SDK $sdk is declared by app tests, but no warmed runtime is configured."
              exit 1
            fi
            if [ ! -f "$ROBOLECTRIC_DEPENDENCY_DIR/$runtime" ]; then
              echo "::error::Robolectric SDK $sdk requires missing warmed runtime $runtime."
              exit 1
            fi
          done

      - name: App unit tests
        if: steps.probe.outputs.app == 'true'
        env:
          ROBOLECTRIC_DEPENDENCY_DIR: ${{ runner.temp }}/robolectric-dependencies
        run: >-
          ./gradlew :app:testDebugUnitTest
          -PdesignPacketTests=exclude
          -ProbolectricOffline=true
          -ProbolectricDependencyDir="$ROBOLECTRIC_DEPENDENCY_DIR"
          --no-daemon
        working-directory: android

      - name: Design-packet verifier tests
        if: steps.probe.outputs.app == 'true'
        run: python3 .github/workflows/scripts/tests/test_verify_android_design_packet.py

      # Renders Compose to PNG under Robolectric — no emulator, no display.
      # It remains a genuine default-branch test gate; pull requests warm the
      # same API 34 runtime because ordinary app tests also declare that SDK.
      - name: Design-packet tests
        if: >-
          steps.probe.outputs.app == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ROBOLECTRIC_DEPENDENCY_DIR: ${{ runner.temp }}/robolectric-dependencies
        run: >-
          timeout --signal=TERM --kill-after=30s 40m
          ./gradlew :app:testDebugUnitTest
          -PdesignPacketTests=only
          -Proborazzi.test.record=true
          -ProbolectricOffline=true
          -ProbolectricDependencyDir="$ROBOLECTRIC_DEPENDENCY_DIR"
          --no-daemon
        working-directory: android

      - name: Verify complete Android design packet
        if: >-
          steps.probe.outputs.app == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: >-
          python3 .github/workflows/scripts/verify_android_design_packet.py
          android/app/build/outputs/roborazzi

      - name: Upload Android design packet
        if: >-
          success() &&
          steps.probe.outputs.app == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-design-packet
          path: android/app/build/outputs/roborazzi
          retention-days: 30

      - name: Upload test report on failure
        if: failure() && steps.probe.outputs.gradle == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-report
          path: android/**/build/reports/tests/**
          retention-days: 7
