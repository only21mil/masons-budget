name: Clients CI

# Builds and verifies the Linux and Android clients on GitHub runners so no
# toolchain has to be installed on a workstation. The Ubuntu runner ships the
# Android SDK with licences already accepted, which is why the Android job needs
# no interactive gate.
#
# This workflow never touches the live Convex deployment, never signs anything,
# and never publishes. Apple builds stay in deploy.yml behind their own manual
# trigger.

on:
  # main is included deliberately: it was previously excluded to avoid duplicate
  # push+PR runs, which meant the default branch was never verified after a
  # merge. Concurrency below handles the duplication instead.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-domain:
    name: Shared domain contract
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @vogel-vault/domain

      - name: Parity tests against the Swift contract
        run: npm run test --workspace @vogel-vault/domain

  linux-client:
    name: Linux client
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    needs: shared-domain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck renderer
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: linux

      - name: Typecheck electron main/preload
        run: npx tsc --noEmit -p tsconfig.electron.json
        working-directory: linux

      - name: Lint
        run: npx eslint .
        working-directory: linux

      - name: Preload boundary guard
        run: node scripts/qa-preload-boundary.mjs
        working-directory: linux

      - name: Render matrix (20 routes x profiles x states)
        run: npx vitest run
        working-directory: linux

      - name: Build
        run: npx vite build
        working-directory: linux

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: linux-client-dist
          path: |
            linux/dist
            linux/dist-electron
          retention-days: 7

      # Design packet: every page at both widths, plus sampled states and the
      # child profile. Headless, so it needs no display. Download the artifact to
      # review the UI without running the app.
      - name: Install Chromium for screenshots
        run: npx playwright install --with-deps chromium
        working-directory: linux

      - name: Capture design packet
        run: npm run screenshots
        working-directory: linux

      - name: Upload design packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-design-packet
          path: linux/screenshots
          retention-days: 30

  android-client:
    name: Android client
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    needs: shared-domain
    steps:
      - uses: actions/checkout@v4

      - name: Detect which Android modules exist
        id: probe
        run: |
          if [ -f android/settings.gradle.kts ]; then
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle=false" >> "$GITHUB_OUTPUT"
            echo "::notice::android/ not scaffolded yet — skipping."
          fi
          if [ -f android/app/build.gradle.kts ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::android/app not scaffolded yet — domain module only, no APK."
          fi

      - uses: actions/setup-java@v4
        if: steps.probe.outputs.gradle == 'true'
        with:
          distribution: temurin
          java-version: 21

      # Gradle comes from the action rather than a committed wrapper jar, so no
      # binary blob lives in the repo. The domain module is plain Kotlin/JVM and
      # needs no Android SDK — only the app module does.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.probe.outputs.gradle == 'true'
        with:
          gradle-version: "8.12"

      - name: Domain parity tests (shared fixture, no Android SDK)
        if: steps.probe.outputs.gradle == 'true'
        run: gradle :domain:test --no-daemon
        working-directory: android

      # A signing identity that survives between runs. Gradle otherwise generates
      # a throwaway ~/.android/debug.keystore on each fresh runner, so every CI
      # APK is signed by a different certificate and installing a new one over
      # the last on the Fold fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE —
      # uninstall-first every time, losing the app's state.
      #
      # Optional on purpose. With no secret set the step is a no-op, the build
      # falls back to the generated keystore, and forks stay green.
      #
      # To create one (these are the published Android debug defaults, which
      # android/app/build.gradle.kts also defaults to, so the keystore secret is
      # the only one you need):
      #   keytool -genkeypair -v -keystore vogel-debug.keystore -storetype PKCS12 \
      #     -alias androiddebugkey -storepass android -keypass android \
      #     -keyalg RSA -keysize 2048 -validity 10950 \
      #     -dname "CN=Android Debug,O=Android,C=US"
      #   base64 -w0 vogel-debug.keystore | gh secret set ANDROID_DEBUG_KEYSTORE_BASE64
      #
      # Only the decoded file's path is exported to a later step; the encoded
      # value and the passwords stay bound to the single step that needs them.
      - name: Materialise the stable debug keystore
        id: debug_keystore
        if: steps.probe.outputs.app == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Using Gradle's generated debug keystore, so this APK will not install over an earlier CI build."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/vogel-debug.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not valid base64. Re-encode it with: base64 -w0 vogel-debug.keystore"
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 decoded to an empty file. Re-encode it with base64 -w0."
            exit 1
          fi
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Signing debug builds with the repository debug keystore."

      - name: Assemble debug APK
        if: steps.probe.outputs.app == 'true'
        env:
          # Empty when the secret is absent, which build.gradle.kts treats as
          # "leave the debug signing config alone".
          VOGEL_DEBUG_KEYSTORE: ${{ steps.debug_keystore.outputs.path }}
          VOGEL_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          VOGEL_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          VOGEL_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: android

      # The certificate digest ships inside every APK, so printing it leaks
      # nothing and is the only way to confirm from here that two runs share an
      # identity. Diagnostic, never a gate.
      - name: Report the debug signing certificate
        if: steps.probe.outputs.app == 'true'
        continue-on-error: true
        working-directory: android
        run: |
          # No `set -e`: the runner's shell already has it, and every lookup here
          # is allowed to come up empty without ending the step.
          set +e
          set -u
          APK=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -1)
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          if [ -n "$APK" ] && [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -i 'digest'
          else
            echo "::notice::apksigner or the APK was not found — skipping the fingerprint report."
          fi
          exit 0

      # Renders Compose to PNG under Robolectric — no emulator, no display.
      # Review artifact, not a pixel-diff gate: behaviour is asserted by the
      # domain and threshold tests, so a font nudge must not fail the build.
      - name: App unit tests + design packet
        if: steps.probe.outputs.app == 'true'
        run: gradle :app:testDebugUnitTest -Proborazzi.test.record=true --no-daemon
        working-directory: android

      - name: Upload Android design packet
        if: always() && steps.probe.outputs.app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-design-packet
          path: android/app/build/outputs/roborazzi
          retention-days: 30

      # Debug-signed only — a sideload artifact for the Fold, never a release
      # build. Release signing stays out of CI.
      - name: Upload debug APK
        if: steps.probe.outputs.app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vogel-vault-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test report on failure
        if: failure() && steps.probe.outputs.gradle == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/**/build/reports/tests/**
          retention-days: 7

      # Hosted runners are discarded anyway; this is the same discipline deploy.yml
      # applies to Apple signing material, and it costs nothing.
      - name: Remove the debug keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/vogel-debug.keystore"
