name: Buzz Mac signed release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed immutable only21mil/buzz commit (40 lowercase hex)
        required: true
        type: string
      version:
        description: Desktop version already committed in that source
        required: true
        type: string

permissions:
  contents: read

# Serialize Buzz releases; every signing command explicitly selects its keychain.
concurrency:
  group: buzz-macos-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'only21mil/masons-budget'
    runs-on: [self-hosted, macOS, ARM64, macbook-pro-m5]
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_TAURI_SIGNING_PUBLIC_KEY }}
      BUZZ_UPDATER_ENDPOINT: https://github.com/only21mil/buzz/releases/download/buzz-desktop-latest/latest.json
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      CMAKE_OSX_DEPLOYMENT_TARGET: '10.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - name: Validate release inputs before source checkout
        run: python3 controller/.github/workflows/scripts/buzz_macos_release.py inputs --source "$SOURCE_SHA" --version "$VERSION" --arch "$ARCH"
      - name: Build immutable source in a confined MBP workspace
        run: /usr/bin/python3 -I controller/.github/workflows/scripts/buzz_macos_build_boundary.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-macos-unsigned-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: unsigned-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: [self-hosted, macOS, ARM64, macbook-pro-m5]
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      ARCH: ${{ matrix.arch }}
      BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_TAURI_SIGNING_PUBLIC_KEY }}
      BUZZ_UPDATER_ENDPOINT: https://github.com/only21mil/buzz/releases/download/buzz-desktop-latest/latest.json
    steps:
      - name: Require the MBP signing account
        run: test "$(/usr/bin/id -un)" = m5mbp
      # This job never checks out Buzz, runs its scripts, or executes its binaries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buzz-macos-unsigned-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: unsigned
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked release tool without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/workflows/scripts/buzz-macos-tools
      - name: Validate and extract inert app before credentials exist
        run: python3 .github/workflows/scripts/buzz_macos_release.py prepare --input unsigned --source "$SOURCE_SHA" --version "$VERSION" --arch "$ARCH"
      - name: Sign, notarize, staple, verify and retain final artifacts
        env:
          BUZZ_DEVELOPER_ID_P12_B64: ${{ secrets.BUZZ_DEVELOPER_ID_P12_B64 }}
          BUZZ_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.BUZZ_DEVELOPER_ID_P12_PASSWORD }}
          BUZZ_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BUZZ_TAURI_SIGNING_PRIVATE_KEY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 .github/workflows/scripts/buzz_macos_release.py sign --input unsigned --source "$SOURCE_SHA" --version "$VERSION" --arch "$ARCH"
      - name: Always remove run-scoped credentials and keychain
        if: always()
        run: python3 .github/workflows/scripts/buzz_macos_release.py cleanup --arch "$ARCH"
      - name: Retain notarization diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-macos-diagnostics-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: signed/*-notary-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain complete signed candidate after cleanup passes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-macos-signed-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: signed/*
          if-no-files-found: error
          retention-days: 30
