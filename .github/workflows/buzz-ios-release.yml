name: Buzz iOS TestFlight release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed immutable only21mil/buzz commit
        required: true
        type: string
      version:
        description: iOS marketing version
        required: true
        type: string
      build_number:
        description: Monotonic iOS build number
        required: true
        type: string

permissions:
  contents: read

# Hosted jobs use fresh VMs; serialize only Buzz iOS numbering and uploads.
concurrency:
  group: buzz-ios-testflight-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'only21mil/masons-budget'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - name: Validate public release inputs
        run: >-
          /usr/bin/python3 -I controller/.github/workflows/scripts/buzz_ios_release.py inputs
          --source "$SOURCE_SHA" --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Build immutable source without signing credentials on a disposable VM
        run: /bin/bash controller/.github/workflows/scripts/buzz_ios_hosted_build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-ios-unsigned-${{ inputs.source_sha }}
          path: unsigned/*
          if-no-files-found: error
          retention-days: 7

  sign-upload:
    needs: build
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Require a separate GitHub-hosted signing VM
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buzz-ios-unsigned-${{ inputs.source_sha }}
          path: unsigned
      - name: Validate and extract inert app before credentials exist
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_release.py prepare
          --source "$SOURCE_SHA" --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Check the exact ASC app and reject used build numbers
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          node .github/workflows/scripts/buzz_ios_asc.mjs available
          --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Sign parent and extension with their exact App Store profiles
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUZZ_IOS_APP_STORE_PROFILE: ${{ secrets.BUZZ_IOS_APP_STORE_PROFILE }}
          BUZZ_IOS_NSE_APP_STORE_PROFILE: ${{ secrets.BUZZ_IOS_NSE_APP_STORE_PROFILE }}
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_release.py sign
          --source "$SOURCE_SHA" --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Preserve verified IPA before network upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-ios-signed-${{ inputs.source_sha }}
          path: signed-ios/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact verified IPA through retained ASC credential
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_release.py upload
          --source "$SOURCE_SHA" --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Verify Apple processing for the exact uploaded build
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          node .github/workflows/scripts/buzz_ios_asc.mjs processed
          --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Always remove temporary signing material and keychain
        if: always()
        run: >-
          /usr/bin/python3 -I .github/workflows/scripts/buzz_ios_release.py cleanup
          --source "$SOURCE_SHA" --version "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Preserve upload receipt after cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-ios-upload-${{ inputs.source_sha }}
          path: |
            signed-ios/upload.json
            signed-ios/asc-*.json
          if-no-files-found: warn
          retention-days: 30
