name: Buzz Mac pinned signing recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: buzz-apple-release
  cancel-in-progress: false

jobs:
  sign:
    if: github.repository == 'only21mil/masons-budget' && github.run_attempt == 1
    runs-on: [self-hosted, macOS, ARM64, macbook-pro-m5]
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        arch: [aarch64, x86_64]
    env:
      SOURCE_SHA: d9abae67a7d9dfab3d693e968477561456694898
      VERSION: 0.5.20
      ARCH: ${{ matrix.arch }}
      BUZZ_UPDATER_PUBLIC_KEY: ${{ vars.BUZZ_TAURI_SIGNING_PUBLIC_KEY }}
      BUZZ_UPDATER_ENDPOINT: https://github.com/only21mil/buzz/releases/download/buzz-desktop-latest/latest.json
    steps:
      - name: Require the MBP signing account
        run: test "$(/usr/bin/id -un)" = m5mbp
      # This job never checks out Buzz, runs its scripts, or executes its binaries.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/workflows/scripts
      - name: Recover exact original unsigned artifact and verify provider bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/scripts/recover_unsigned.py --arch "$ARCH"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked release tool without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/workflows/scripts/buzz-macos-tools
      - name: Validate and extract inert app before credentials exist
        run: python3 .github/workflows/scripts/buzz_macos_release_recovery.py prepare --input unsigned --source "$SOURCE_SHA" --version "$VERSION" --arch "$ARCH"
      - name: Sign, notarize, staple, verify and retain final artifacts
        env:
          BUZZ_DEVELOPER_ID_P12_B64: ${{ secrets.BUZZ_DEVELOPER_ID_P12_B64 }}
          BUZZ_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.BUZZ_DEVELOPER_ID_P12_PASSWORD }}
          BUZZ_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BUZZ_TAURI_SIGNING_PRIVATE_KEY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/buzz_macos_release_recovery.py sign --input unsigned --source "$SOURCE_SHA" --version "$VERSION" --arch "$ARCH" | tee signing-phase.jsonl
      - name: Always remove run-scoped credentials and keychain
        if: always()
        run: python3 .github/workflows/scripts/buzz_macos_release_recovery.py cleanup --arch "$ARCH"
      - name: Retain notarization diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-macos-recovery-diagnostics-${{ matrix.arch }}-d9abae67a7d9dfab3d693e968477561456694898
          path: |
            signed/*-notary-*.json
            signing-phase.jsonl
            recovery-download-${{ matrix.arch }}.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain complete signed candidate after cleanup passes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buzz-macos-recovery-signed-${{ matrix.arch }}-d9abae67a7d9dfab3d693e968477561456694898
          path: signed/*
          if-no-files-found: error
          retention-days: 30
