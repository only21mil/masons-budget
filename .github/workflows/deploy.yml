name: Deploy to TestFlight (manual trigger only)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        type: choice
        options:
          - ios
          - macos
          - both

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'only21mil/masons-budget'
    runs-on: macos-latest
    strategy:
      matrix:
        platform: ${{ fromJSON(github.event.inputs.platform == 'both' && '["ios", "macos"]' || format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.4'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: MasonsBudget
        run: xcodegen generate --spec project.yml
      - name: Build and Archive
        working-directory: MasonsBudget
        run: |
          if [ "$PLATFORM" = "ios" ]; then
            xcodebuild archive -project MasonsBudget.xcodeproj -scheme MasonsBudget -destination "generic/platform=iOS" -archivePath build/MasonsBudget.xcarchive CODE_SIGN_STYLE=Automatic
            xcodebuild -exportArchive -archivePath build/MasonsBudget.xcarchive -exportPath build/ios -exportOptionsPlist ../ExportOptions.plist
            xcrun altool --upload-app -f build/ios/MasonsBudget.ipa -t ios -u "$APPSTORE_USERNAME" -p "$APPSTORE_PASSWORD"
          else
            xcodebuild archive -project MasonsBudget.xcodeproj -scheme MasonsBudgetMac -destination "generic/platform=macOS" -archivePath build/MasonsBudgetMac.xcarchive CODE_SIGN_STYLE=Automatic
            xcodebuild -exportArchive -archivePath build/MasonsBudgetMac.xcarchive -exportPath build/macos -exportOptionsPlist ../ExportOptions.plist
            xcrun altool --upload-app -f build/macos/MasonsBudget.pkg -t osx -u "$APPSTORE_USERNAME" -p "$APPSTORE_PASSWORD"
          fi
        env:
          PLATFORM: ${{ matrix.platform }}
          APPSTORE_USERNAME: ${{ secrets.APPSTORE_USERNAME }}
          APPSTORE_PASSWORD: ${{ secrets.APPSTORE_PASSWORD }}
