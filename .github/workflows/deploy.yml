name: Deploy to TestFlight (manual trigger only)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        type: choice
        options:
          - ios
          - macos
          - both

jobs:
  build:
    if: github.repository == 'only21mil/masons-budget'
    runs-on: macos-latest
    strategy:
      matrix:
        platform: ${{ fromJSON(github.event.inputs.platform == 'both' && '["ios", "macos"]' || format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Build and Archive
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            xcodebuild archive -scheme MasonsBudget -destination "generic/platform=iOS" -archivePath build/MasonsBudget.xcarchive CODE_SIGN_STYLE=Automatic
            xcodebuild -exportArchive -archivePath build/MasonsBudget.xcarchive -exportPath build/ios -exportOptionsPlist ExportOptions.plist
            xcrun altool --upload-app -f build/ios/MasonsBudget.ipa -t ios -u "${{ secrets.APPSTORE_USERNAME }}" -p "${{ secrets.APPSTORE_PASSWORD }}"
          else
            xcodebuild archive -scheme MasonsBudgetMac -destination "generic/platform=macOS" -archivePath build/MasonsBudgetMac.xcarchive CODE_SIGN_STYLE=Automatic
            xcodebuild -exportArchive -archivePath build/MasonsBudgetMac.xcarchive -exportPath build/macos -exportOptionsPlist ExportOptions.plist
            xcrun altool --upload-app -f build/macos/MasonsBudget.pkg -t osx -u "${{ secrets.APPSTORE_USERNAME }}" -p "${{ secrets.APPSTORE_PASSWORD }}"
          fi
        env:
          APPSTORE_USERNAME: ${{ secrets.APPSTORE_USERNAME }}
          APPSTORE_PASSWORD: ${{ secrets.APPSTORE_PASSWORD }}
