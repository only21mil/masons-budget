name: Deploy to TestFlight (manual trigger only)

# Runs entirely on a GitHub macOS runner — no workstation of Victor's is needed.
#
# Triggering this workflow IS the app-build approval gate described in AGENTS.md.
# It never runs automatically.
#
# Signing is deliberately manual. Human-created distribution identities are
# imported into a throwaway keychain and a human-created App Store profile is
# installed before archive/export. Neither command is allowed to update
# provisioning, so this workflow cannot mint or revoke an Apple certificate.
# The App Store Connect API key is only for the read preflight and upload.
#
# APPLE_MANUAL_SIGNING_READY is a repository variable, absent/false by default.
# Set it only after following docs/apple-manual-signing-runbook.md; until then
# the release gate stops before a macOS runner or any app-build command starts.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        type: choice
        options:
          - ios
          - macos
          - both

permissions:
  contents: read
  checks: read

# One release run at a time across every ref. Matrix serialization only protects
# jobs inside one run; without workflow-level concurrency, two manual runs can
# still upload the same project build number concurrently.
concurrency:
  group: deploy-testflight-only21mil-masons-budget
  cancel-in-progress: false

jobs:
  release-gate:
    name: Require main and green required CI
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact main ref
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::TestFlight deploys must be dispatched from main; got $RELEASE_REF."
            exit 1
          fi
          echo "Release ref is main."

      - name: Require verified manual signing assets
        env:
          MANUAL_SIGNING_READY: ${{ vars.APPLE_MANUAL_SIGNING_READY }}
        run: |
          set -euo pipefail
          if [ "$MANUAL_SIGNING_READY" != "true" ]; then
            echo "::error::Manual Apple signing is inert. Complete docs/apple-manual-signing-runbook.md, then set repository variable APPLE_MANUAL_SIGNING_READY=true."
            exit 1
          fi
          echo "Manual signing assets were explicitly enabled."

      # Check the protected contexts and the completed Apple build at the exact
      # release SHA. A workflow name, detector decision, or older successful run
      # is not enough: commit 0d546d87 shipped alongside a failed Apple run.
      # Check runs must also come from GitHub Actions (App ID 15368), matching
      # branch protection rather than trusting a same-named external check.
      - name: Require green protected checks at the release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          required=(
            "Detect changed trees"
            "actionlint + secret inventory"
            "Shared domain contract"
            "Production wire golden decoders"
            "Convex functions"
            "Linux client"
            "Android client"
            "Build and test the Apple client"
          )
          checks="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?filter=latest&per_page=100")"

          failed=false
          for name in "${required[@]}"; do
            conclusion="$(jq -r --arg name "$name" \
              '[.check_runs[]
                | select(.name == $name and .app.id == 15368)]
               | sort_by(.completed_at // .started_at // .created_at // "")
               | last
               | .conclusion // "missing"' <<< "$checks")"
            if [ "$conclusion" = "success" ]; then
              printf 'PASS  %s\n' "$name"
            else
              printf 'FAIL  %s (%s)\n' "$name" "$conclusion"
              failed=true
            fi
          done

          if [ "$failed" = "true" ]; then
            echo "::error::The exact main release SHA does not have green required CI."
            exit 1
          fi

  preflight:
    name: Verify release secrets and App Store Connect visibility
    needs: release-gate
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Presence and base64 shape only. The macOS import step below proves that
      # the passwords match and the profiles are valid CMS documents before the
      # first xcodebuild command. The human runbook performs the same checks
      # locally before APPLE_MANUAL_SIGNING_READY may be enabled.
      - name: Verify release secret presence
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_IOS_APP_STORE_PROFILE: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE }}
          APPLE_MAC_APP_STORE_PROFILE: ${{ secrets.APPLE_MAC_APP_STORE_PROFILE }}
          APPLE_MAC_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_P12 }}
          APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 .github/workflows/scripts/report_secret_presence.py

      - name: Probe exact bundle and latest build
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_BUNDLE_ID: com.sats21m.masonsbudget
        run: node .github/workflows/scripts/app_store_connect_preflight.mjs

  build:
    needs: preflight
    if: github.repository == 'only21mil/masons-budget'
    runs-on: macos-latest
    strategy:
      # Finish both platform jobs so one failure does not hide the other result.
      # Keep uploads serial because both platforms share a project build number.
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(github.event.inputs.platform == 'both' && '["ios", "macos"]' || format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Must match XCODE_VERSION in swift.yml. If verification and release use
      # different toolchains, a change can pass CI and fail the release — which
      # is precisely how 16.4 survived here long after the runner image dropped
      # it: nothing exercised this path until the first real release attempt.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.6'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: MasonsBudget
        run: xcodegen generate --spec project.yml

      - name: Import manual signing assets
        env:
          PLATFORM: ${{ matrix.platform }}
          APPLE_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_IOS_APP_STORE_PROFILE: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE }}
          APPLE_MAC_APP_STORE_PROFILE: ${{ secrets.APPLE_MAC_APP_STORE_PROFILE }}
          APPLE_MAC_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_P12 }}
          APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          require_secret() {
            if [ -z "$2" ]; then
              echo "::error::$1 is required for the $PLATFORM manual-signing path."
              exit 1
            fi
          }

          require_secret APPLE_DISTRIBUTION_CERTIFICATE_P12 "$APPLE_DISTRIBUTION_CERTIFICATE_P12"
          require_secret APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD"

          if [ "$PLATFORM" = "ios" ]; then
            require_secret APPLE_IOS_APP_STORE_PROFILE "$APPLE_IOS_APP_STORE_PROFILE"
            PROFILE_B64="$APPLE_IOS_APP_STORE_PROFILE"
            EXPECTED_PROFILE_PLATFORM=iOS
            PROFILE_EXTENSION=mobileprovision
          else
            require_secret APPLE_MAC_APP_STORE_PROFILE "$APPLE_MAC_APP_STORE_PROFILE"
            require_secret APPLE_MAC_INSTALLER_CERTIFICATE_P12 "$APPLE_MAC_INSTALLER_CERTIFICATE_P12"
            require_secret APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD "$APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD"
            PROFILE_B64="$APPLE_MAC_APP_STORE_PROFILE"
            EXPECTED_PROFILE_PLATFORM=OSX
            PROFILE_EXTENSION=provisionprofile
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/manual-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12" |
            base64 --decode > "$RUNNER_TEMP/apple-distribution.p12"
          security import "$RUNNER_TEMP/apple-distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          if [ "$PLATFORM" = "macos" ]; then
            printf '%s' "$APPLE_MAC_INSTALLER_CERTIFICATE_P12" |
              base64 --decode > "$RUNNER_TEMP/mac-installer-distribution.p12"
            security import "$RUNNER_TEMP/mac-installer-distribution.p12" \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_MAC_INSTALLER_CERTIFICATE_PASSWORD" \
              -T /usr/bin/productbuild \
              -T /usr/bin/security
          fi

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            grep -q '"Apple Distribution'; then
            echo "::error::The imported distribution p12 has no usable Apple Distribution identity and private key."
            exit 1
          fi
          if [ "$PLATFORM" = "macos" ] &&
            ! security find-identity -v "$KEYCHAIN_PATH" |
              grep -q '"Mac Installer Distribution'; then
            echo "::error::The imported installer p12 has no usable Mac Installer Distribution identity and private key."
            exit 1
          fi

          ENCODED_PROFILE="$RUNNER_TEMP/$PLATFORM-profile"
          DECODED_PROFILE="$RUNNER_TEMP/$PLATFORM-profile.plist"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$ENCODED_PROFILE"
          security cms -D -i "$ENCODED_PROFILE" > "$DECODED_PROFILE"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$DECODED_PROFILE")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$DECODED_PROFILE")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$DECODED_PROFILE")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$DECODED_PROFILE")
          PROFILE_PLATFORM=$(/usr/libexec/PlistBuddy -c "Print :Platform:0" "$DECODED_PROFILE")
          PROFILE_DEBUG=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$DECODED_PROFILE")

          if [ "$PROFILE_TEAM" != "384ZGKG4GB" ] ||
            [ "$PROFILE_APP_ID" != "384ZGKG4GB.com.sats21m.masonsbudget" ] ||
            [ "$PROFILE_PLATFORM" != "$EXPECTED_PROFILE_PLATFORM" ] ||
            [ "$PROFILE_DEBUG" != "false" ]; then
            echo "::error::The $PLATFORM profile is not a non-debug App Store profile for team 384ZGKG4GB and com.sats21m.masonsbudget."
            exit 1
          fi

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          INSTALLED_PROFILE_PATH="$PROFILE_DIR/$PROFILE_UUID.$PROFILE_EXTENSION"
          mkdir -p "$PROFILE_DIR"
          cp "$ENCODED_PROFILE" "$INSTALLED_PROFILE_PATH"

          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/mac-installer-distribution.p12" \
            "$ENCODED_PROFILE" \
            "$DECODED_PROFILE"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "INSTALLED_PROFILE_PATH=$INSTALLED_PROFILE_PATH"
          } >> "$GITHUB_ENV"
          echo "Validated and installed the $PLATFORM manual-signing assets."

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::App Store Connect secrets missing. Required: ASC_API_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID."
            exit 1
          fi
          # altool looks for the key by convention in this directory.
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # The secret may hold the raw PEM or a base64 wrapper of it, depending
          # on how it was set. Assuming base64 unconditionally silently wrote
          # garbage, and xcodebuild reported it four steps later as an opaque
          # DVTFoundation.JWT.Error.keyPathInvalid. Detect, then verify.
          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || true
          fi
          chmod 600 "$KEY_PATH"

          # Fail here, with a sentence that says what to do, rather than letting
          # a malformed key surface as a JWT error inside xcodebuild.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_API_KEY_P8 did not yield a valid .p8. Set it to the file contents verbatim: gh secret set ASC_API_KEY_P8 -R only21mil/masons-budget < AuthKey_XXXX.p8"
            exit 1
          fi
          echo "App Store Connect key written and validated."
          # xcodebuild wants an explicit path; altool finds it by convention.
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: MasonsBudget
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "ios" ]; then
            SCHEME=MasonsBudget
            DESTINATION="generic/platform=iOS"
            ARCHIVE=build/MasonsBudget.xcarchive
          else
            SCHEME=MasonsBudgetMac
            DESTINATION="generic/platform=macOS"
            ARCHIVE=build/MasonsBudgetMac.xcarchive
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project MasonsBudget.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=384ZGKG4GB \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export
        working-directory: MasonsBudget
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          EXPORT_DIR="build/${PLATFORM}"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions-${PLATFORM}.plist"
          cp ../ExportOptions.plist "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:com.sats21m.masonsbudget string $PROFILE_UUID" \
            "$EXPORT_OPTIONS"
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

      # Keep the signed artifact BEFORE attempting the upload. Archive and export
      # are the expensive, fragile part; the upload depends on App Store Connect
      # being healthy, which it was not on 2026-07-26 (six consecutive HTTP 500s
      # from list-apps). Without this the whole build is thrown away on an
      # outage and has to be recreated to retry.
      - name: Preserve the signed artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}-release-${{ github.run_number }}
          path: |
            MasonsBudget/build/*/*.ipa
            MasonsBudget/build/*/*.pkg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to TestFlight
        working-directory: MasonsBudget
        env:
          PLATFORM: ${{ matrix.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "ios" ]; then
            ARTIFACT=$(find "$EXPORT_DIR" -name "*.ipa" | head -1)
            TYPE=ios
          else
            ARTIFACT=$(find "$EXPORT_DIR" -name "*.pkg" | head -1)
            TYPE=osx
          fi
          if [ -z "$ARTIFACT" ]; then
            echo "::error::Export produced no artifact for $PLATFORM."
            exit 1
          fi
          echo "Uploading $(basename "$ARTIFACT")"
          xcrun altool --upload-app -f "$ARTIFACT" -t "$TYPE" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true
          rm -rf "$HOME/private_keys"
          if [ -n "${INSTALLED_PROFILE_PATH:-}" ]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi
          rm -f "$RUNNER_TEMP"/ExportOptions-*.plist
