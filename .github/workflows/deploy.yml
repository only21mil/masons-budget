name: Deploy to TestFlight (manual trigger only)

# Runs entirely on a GitHub macOS runner — no workstation of Victor's is needed.
#
# Triggering this workflow IS the app-build approval gate described in AGENTS.md.
# It never runs automatically.
#
# Signing: the runner has no Apple ID, so CODE_SIGN_STYLE=Automatic cannot work.
# The certificate is imported into a throwaway keychain and the provisioning
# profile installed, then archive/export run against it. Upload uses the App
# Store Connect API key rather than an Apple ID username/password — the previous
# version of this workflow referenced APPSTORE_USERNAME/APPSTORE_PASSWORD
# secrets that do not exist in this repository.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        type: choice
        options:
          - ios
          - macos
          - both

permissions:
  contents: read
  checks: read

# One release run at a time across every ref. Matrix serialization only protects
# jobs inside one run; without workflow-level concurrency, two manual runs can
# still upload the same project build number concurrently.
concurrency:
  group: deploy-testflight-only21mil-masons-budget
  cancel-in-progress: false

jobs:
  release-gate:
    name: Require main and green required CI
    runs-on: ubuntu-latest
    steps:
      - name: Require an exact main ref
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::TestFlight deploys must be dispatched from main; got $RELEASE_REF."
            exit 1
          fi
          echo "Release ref is main."

      # Check the protected contexts and the completed Apple build at the exact
      # release SHA. A workflow name, detector decision, or older successful run
      # is not enough: commit 0d546d87 shipped alongside a failed Apple run.
      # Check runs must also come from GitHub Actions (App ID 15368), matching
      # branch protection rather than trusting a same-named external check.
      - name: Require green protected checks at the release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Two classes, because "did not need to run" and "failed" are not the
          # same thing and this gate previously could not tell them apart.
          #
          # ALWAYS: these run on every commit. Nothing but success is acceptable.
          # The two detectors are in here deliberately — their success is what
          # proves CI actually evaluated this SHA, so a skip below is a decision
          # rather than a workflow that never started.
          always_green=(
            "Detect changed trees"
            "Detect Apple changes"
            "actionlint + secret inventory"
            "Shared domain contract"
            "Convex functions"
          )
          # CONDITIONAL: gated by the detectors above. `skipped` is the correct
          # outcome for a commit that touches none of that tree, so treating it
          # as a failure made a release impossible from any commit that did not
          # touch Apple files — which is most commits. `failure`, `cancelled`,
          # `timed_out`, `missing` and anything still pending remain fatal, so
          # the case this gate exists for still trips it: commit 0d546d87
          # shipped alongside a FAILED Apple run.
          conditional=(
            "Production wire golden decoders"
            "Linux client"
            "Android client"
            "Build and test the Apple client"
          )
          checks="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?filter=latest&per_page=100")"

          conclusion_of() {
            jq -r --arg name "$1" \
              '[.check_runs[]
                | select(.name == $name and .app.id == 15368)]
               | sort_by(.completed_at // .started_at // .created_at // "")
               | last
               | if . == null then "missing"
                 elif .status != "completed" then "pending"
                 else (.conclusion // "missing") end' <<< "$checks"
          }

          failed=false
          for name in "${always_green[@]}"; do
            conclusion="$(conclusion_of "$name")"
            if [ "$conclusion" = "success" ]; then
              printf 'PASS  %s\n' "$name"
            else
              printf 'FAIL  %s (%s)\n' "$name" "$conclusion"
              failed=true
            fi
          done
          for name in "${conditional[@]}"; do
            conclusion="$(conclusion_of "$name")"
            case "$conclusion" in
              success) printf 'PASS  %s\n' "$name" ;;
              skipped) printf 'SKIP  %s (not applicable to this commit)\n' "$name" ;;
              *)       printf 'FAIL  %s (%s)\n' "$name" "$conclusion"; failed=true ;;
            esac
          done

          if [ "$failed" = "true" ]; then
            echo "::error::The exact main release SHA does not have green required CI."
            exit 1
          fi

  preflight:
    name: Verify App Store Connect visibility
    needs: release-gate
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Probe exact bundle and latest build
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_BUNDLE_ID: com.sats21m.masonsbudget
        run: node .github/workflows/scripts/app_store_connect_preflight.mjs

  build:
    needs: preflight
    if: github.repository == 'only21mil/masons-budget'
    runs-on: [self-hosted, macOS, ARM64, xcode]
    strategy:
      # Finish both platform jobs so one failure does not hide the other result.
      # Keep uploads serial because both platforms share a project build number.
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: ${{ fromJSON(github.event.inputs.platform == 'both' && '["ios", "macos"]' || format('["{0}"]', github.event.inputs.platform)) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Must match XCODE_VERSION in swift.yml. If verification and release use
      # different toolchains, a change can pass CI and fail the release — which
      # is precisely how 16.4 survived here long after the runner image dropped
      # it: nothing exercised this path until the first real release attempt.
      # Self-hosted: setup-xcode expects the hosted image's versioned bundles
      # (/Applications/Xcode_26.6.app). The mini has a single /Applications/
      # Xcode.app, so that action fails outright. Assert the version instead —
      # the guarantee we need is "the pinned Xcode is what built this", and a
      # mismatch must fail loudly rather than quietly release from another.
      - name: Verify the pinned Xcode
        run: |
          set -euo pipefail
          expected='26.6'
          # NOT `xcodebuild -version | head -1`: head closes the pipe after one
          # line, xcodebuild writes into the closed descriptor and dies with an
          # uncaught NSException, exit 134. Capture in full, then parse.
          version_output="$(xcodebuild -version)"
          actual="$(printf '%s\n' "$version_output" | awk 'NR==1 {print $2}')"
          echo "xcodebuild reports $actual; release pins $expected"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Xcode $expected is pinned for release but this runner has $actual." >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        working-directory: MasonsBudget
        run: xcodegen generate --spec project.yml

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::App Store Connect secrets missing. Required: ASC_API_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID."
            exit 1
          fi
          # altool looks for the key by convention in this directory.
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # The secret may hold the raw PEM or a base64 wrapper of it, depending
          # on how it was set. Assuming base64 unconditionally silently wrote
          # garbage, and xcodebuild reported it four steps later as an opaque
          # DVTFoundation.JWT.Error.keyPathInvalid. Detect, then verify.
          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || true
          fi
          chmod 600 "$KEY_PATH"

          # Fail here, with a sentence that says what to do, rather than letting
          # a malformed key surface as a JWT error inside xcodebuild.
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_API_KEY_P8 did not yield a valid .p8. Set it to the file contents verbatim: gh secret set ASC_API_KEY_P8 -R only21mil/masons-budget < AuthKey_XXXX.p8"
            exit 1
          fi
          echo "App Store Connect key written and validated."
          # xcodebuild wants an explicit path; altool finds it by convention.
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Signing assets come from App Store Connect via the API key, not from an
      # exported .p12. The project is already CODE_SIGN_STYLE=Automatic with
      # DEVELOPMENT_TEAM 384ZGKG4GB and ExportOptions.plist says signingStyle
      # automatic, so a certificate import was never the right shape here — and
      # the imported pair had drifted out of sync anyway (the p12 and its
      # password no longer matched, and the machine holding the originals is
      # gone). An API key cannot go stale the same way and needs no Mac.
      - name: Archive
        working-directory: MasonsBudget
        env:
          PLATFORM: ${{ matrix.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "ios" ]; then
            SCHEME=MasonsBudget
            DESTINATION="generic/platform=iOS"
            ARCHIVE=build/MasonsBudget.xcarchive
          else
            SCHEME=MasonsBudgetMac
            DESTINATION="generic/platform=macOS"
            ARCHIVE=build/MasonsBudgetMac.xcarchive
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project MasonsBudget.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export
        working-directory: MasonsBudget
        env:
          PLATFORM: ${{ matrix.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_DIR="build/${PLATFORM}"
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist ../ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Keep the signed artifact BEFORE attempting the upload. Archive and export
      # are the expensive, fragile part; the upload depends on App Store Connect
      # being healthy, which it was not on 2026-07-26 (six consecutive HTTP 500s
      # from list-apps). Without this the whole build is thrown away on an
      # outage and has to be recreated to retry.
      - name: Preserve the signed artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}-release-${{ github.run_number }}
          path: |
            MasonsBudget/build/*/*.ipa
            MasonsBudget/build/*/*.pkg
          if-no-files-found: warn
          retention-days: 14

      - name: Upload to TestFlight
        working-directory: MasonsBudget
        env:
          PLATFORM: ${{ matrix.platform }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "ios" ]; then
            ARTIFACT=$(find "$EXPORT_DIR" -name "*.ipa" | head -1)
            TYPE=ios
          else
            ARTIFACT=$(find "$EXPORT_DIR" -name "*.pkg" | head -1)
            TYPE=osx
          fi
          if [ -z "$ARTIFACT" ]; then
            echo "::error::Export produced no artifact for $PLATFORM."
            exit 1
          fi
          echo "Uploading $(basename "$ARTIFACT")"
          xcrun altool --upload-app -f "$ARTIFACT" -t "$TYPE" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
