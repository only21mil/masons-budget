name: Release secrets preflight (manual, reports presence only)

# Answers "would a TestFlight run get past signing today?" without archiving,
# signing, exporting, uploading, or touching App Store Connect at all. Run this
# before Deploy to TestFlight rather than discovering a missing secret ten
# minutes into a macOS archive.
#
# Nothing here prints a secret. The report is booleans only: set or not, and for
# the base64 ones whether the paste actually decodes. Not even a length — the
# length of an App Store Connect key id would narrow it considerably.
#
# THE SUBTLE PART, since getting this wrong is the usual way presence checks are
# written: the `secrets` context is NOT available in any `if:`. Neither
# `jobs.<id>.if` nor `steps.<id>.if` can see it, so
#
#     if: secrets.ASC_KEY_ID != ''            # invalid, actionlint rejects it
#
# never works. The alternatives are worse than they look:
#
#     run: test -n "${{ secrets.ASC_KEY_ID }}"   # splices the value into the
#                                                # shell source; a value with a
#                                                # quote in it becomes syntax
#
# The correct shape is the one below: bind each secret to its own `env:` key and
# let the process read it from its environment, where it is a value rather than
# a fragment of source. workflow-lint.yml enforces that shape across every
# workflow in the repository.
#
# The env block must name every secret explicitly. There is no way to enumerate
# secrets at runtime, and the one thing that looks like it — toJSON(secrets) —
# would dump every value straight into the log. The inventory cross-check in
# workflow-lint.yml is what keeps this list from drifting out of date.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Report release secret presence
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Report presence
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: python3 .github/workflows/scripts/report_secret_presence.py
