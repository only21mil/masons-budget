name: Swift CI

# The Apple client compiled nowhere. PRs #10 (month-scoping tests) and #11
# (read-token entry) merged on a green tick from workflows that only build the
# Linux and Android clients, so 75 Swift files and seven XCTest classes have
# never been through a compiler in CI and the tests have never run.
#
# This workflow closes that hole and stops there. It builds and tests. It does
# not sign, archive, export or upload — that is deploy.yml's job, behind its
# manual trigger, which is the app-build approval gate. Nothing here may become a
# second route to a shipped build, which is why every xcodebuild call below
# disables signing outright rather than merely skipping the upload step.
#
# Xcode setup follows deploy.yml — same pinned setup-xcode action, same
# `xcodegen generate --spec project.yml`, project.yml as the source of truth and
# the .xcodeproj as generated output that is never hand-edited. It does NOT
# follow deploy.yml's Xcode version, because that version no longer exists;
# see XCODE_VERSION below. If the two drift further, a change can pass here and
# fail during a release.
#
# Cost: macos-latest bills at 10x the Linux rate on a private repository
# ($0.08/min vs $0.008/min), so this is gated three ways — a paths filter to
# Swift-touching changes, a repository check so forks never spend it, and
# cancel-in-progress concurrency. See the PR for the per-run estimate.

on:
  push:
    branches:
      - main
    paths:
      - 'MasonsBudget/**'
      - 'Package.swift'
      - 'Tests/**'
      - 'shared/domain/convex-wire-golden-provenance.json'
      - 'shared/domain/fixtures/convex-wire-golden/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'MasonsBudget/**'
      - 'Package.swift'
      - 'Tests/**'
      - 'shared/domain/convex-wire-golden-provenance.json'
      - 'shared/domain/fixtures/convex-wire-golden/**'
      - '.github/workflows/swift.yml'
  # The escape hatch: paths filters do not apply to a manual run, so a Swift
  # build can still be forced on a branch that only touched, say, a fixture.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

env:
  # NOT 16.4, which is what deploy.yml and project.yml still say. Run 1 of this
  # workflow proved macos-latest no longer carries any Xcode 16: the image ships
  # 26.0.1 through 26.6 and setup-xcode fails outright with "Could not find
  # Xcode version that satisfied version spec: '16.4'". deploy.yml's archive
  # step is therefore dead on arrival too — the whole reason this workflow
  # exists is that nobody had ever run either one.
  #
  # This must track the image's newest Xcode, not the oldest. Run 2 pinned
  # 26.0.1 on the theory that the least new SDK was safest for sources written
  # against Xcode 16, and it failed: the simulator runtimes installed on the
  # image belong to the newest Xcode, so `simctl` happily listed and booted an
  # iPhone 17 that xcodebuild then rejected, because Xcode 26.0.1's SDK is 26.0
  # and no eligible iOS Simulator platform existed for it. An older Xcode on
  # this image has no simulator to test on.
  #
  # Still an exact pin rather than latest-stable: when the image rotates, this
  # fails loudly at setup with a one-line fix and setup-xcode prints the table
  # of what is available, whereas a floating version turns up months later as an
  # unexplained compile error. Take the highest GM from that table.
  XCODE_VERSION: '26.6'
  # Linux builds this exact release from its checksummed source archive. The
  # Homebrew formula is macOS-only, despite Homebrew itself supporting Linux.
  # Pinning makes a generator release an explicit reviewable change instead of
  # letting a formula update rewrite the committed project unexpectedly.
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: c83c7bd70255b0ddf4116dadce16bdf0e5939165b43a544e124de294ec84aa27
  # brew's auto-update pulls a few hundred megabytes and a minute of wall clock
  # before it installs anything, and this runner is billed by the minute.
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  project-consistency:
    name: Verify committed Xcode project
    if: github.repository == 'only21mil/masons-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # ubuntu-latest already carries Swift. XcodeGen's Homebrew formula is
      # macOS-only, but the upstream Swift package builds and runs on Linux.
      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/xcodegen.tar.gz"
          SOURCE_DIR="$RUNNER_TEMP/xcodegen-source"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$ARCHIVE" \
            "https://github.com/yonaskolb/XcodeGen/archive/refs/tags/${XCODEGEN_VERSION}.tar.gz"
          echo "${XCODEGEN_SHA256}  ${ARCHIVE}" | sha256sum --check --strict -
          mkdir -p "$SOURCE_DIR"
          tar xzf "$ARCHIVE" -C "$SOURCE_DIR" --strip-components=1
          swift build \
            --package-path "$SOURCE_DIR" \
            --configuration release \
            --product xcodegen
          echo "$SOURCE_DIR/.build/release" >> "$GITHUB_PATH"

      # This is deliberately a prerequisite of the billed macOS job. A stale
      # committed project fails here before any 10x runner starts.
      - name: Require the generated project to be committed
        working-directory: MasonsBudget
        run: |
          set -euo pipefail
          # XcodeGen's Linux build cannot replace an existing workspace bundle,
          # so move the committed output aside and generate a clean one. Git's
          # index still provides the comparison baseline.
          mv MasonsBudget.xcodeproj "$RUNNER_TEMP/committed-MasonsBudget.xcodeproj"
          xcodegen generate --spec project.yml --quiet
          UNTRACKED_PROJECT_FILES=$(git ls-files --others --exclude-standard -- MasonsBudget.xcodeproj)
          if git diff --quiet --exit-code -- MasonsBudget.xcodeproj && [ -z "$UNTRACKED_PROJECT_FILES" ]; then
            echo "PASS: MasonsBudget.xcodeproj matches project.yml."
          else
            git diff --stat -- MasonsBudget.xcodeproj
            printf '%s\n' "$UNTRACKED_PROJECT_FILES"
            echo "FAIL: MasonsBudget.xcodeproj is stale. Run 'cd MasonsBudget && xcodegen generate --spec project.yml' and commit the result."
            exit 1
          fi

  swift:
    name: Build and test the Apple client
    # One job, not three. Xcode selection, the brew install and project
    # generation cost the same few minutes whichever leg needs them, and on a
    # 10x runner paying for that setup once beats parallelism.
    if: github.repository == 'only21mil/masons-budget'
    needs: project-consistency
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Printed because the runner image moves under us: when this workflow
      # starts failing on a build that has not changed, the first question is
      # which Xcode and which SDK it got today.
      - name: Report the toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -iE 'ios|macos' || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: MasonsBudget
        run: xcodegen generate --spec project.yml

      # Cheapest signal first. VogelVaultCore is a plain SwiftPM library with no
      # simulator, no signing and no app bundle, so a syntax-level break in
      # VoiceParser surfaces here in under a minute instead of eight minutes into
      # an app build.
      - name: SwiftPM package tests
        run: swift test

      # Ask xcodebuild, not simctl. Run 2 chose the device from `simctl list
      # devices available`, which reports the shared CoreSimulator device set —
      # every runtime on the machine, whichever Xcode installed it. The chosen
      # iPhone booted fine and xcodebuild then refused it, because a device
      # simctl calls available is not necessarily a destination this Xcode has
      # an eligible platform for.
      #
      # -showdestinations is the same resolver that will consume the answer, and
      # it lists only what this scheme can actually run on. Reading the last
      # eligible iPhone out of it cannot disagree with the test step.
      #
      # Hardcoding a model name would rot the first time the image ships a
      # different device set, and any iPhone runs a unit-test bundle equally well.
      - name: Choose an iOS simulator
        id: simulator
        working-directory: MasonsBudget
        run: |
          set -euo pipefail
          DESTINATIONS=$(xcodebuild -showdestinations \
            -project MasonsBudget.xcodeproj -scheme MasonsBudget 2>&1 || true)
          printf '%s\n' "$DESTINATIONS"

          # Only the eligible block: the ineligible one lists real ids too, and
          # picking from it is exactly the mistake run 2 made.
          UDID=$(printf '%s\n' "$DESTINATIONS" \
            | awk '/Available destinations/{ok=1; next} /Ineligible destinations/{ok=0} ok' \
            | grep 'platform:iOS Simulator' \
            | grep -v 'placeholder' \
            | grep 'name:iPhone' \
            | tail -1 \
            | sed -n 's/.*[[:space:]]id:\([^,]*\),.*/\1/p' \
            | tr -d '[:space:]' || true)
          # `|| true` above is load-bearing: with pipefail set, a grep that
          # matches nothing would kill this step outright and the explanatory
          # error below — the whole point of the step — would never print.

          if [ -z "$UDID" ]; then
            echo "::error::xcodebuild lists no eligible iPhone simulator destination for this scheme. The destination dump above is the diagnosis; check that the pinned Xcode owns an installed iOS simulator runtime."
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Testing on simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Booting explicitly rather than letting xcodebuild do it lazily: a slow
      # first boot otherwise shows up as a timeout inside the test action, which
      # reads like a test failure and is not one.
      - name: Boot the simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Signing is disabled three ways because one is not enough: the project
      # sets CODE_SIGN_STYLE=Automatic with a DEVELOPMENT_TEAM, and a runner has
      # no Apple ID to resolve a profile with. The simulator does not verify
      # signatures, so an unsigned bundle installs and the tests run.
      #
      # This is also the structural reason this workflow cannot produce a
      # shippable artifact even by accident.
      - name: iOS unit tests
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        working-directory: MasonsBudget
        run: |
          set -euo pipefail
          xcodebuild test \
            -project MasonsBudget.xcodeproj \
            -scheme MasonsBudget \
            -destination "platform=iOS Simulator,id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/MasonsBudget-iOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # Build only: the MasonsBudgetMac scheme has no test targets, and the two
      # app targets compile the same sources for different platforms, so this
      # exists to catch an iOS-only API landing in shared code. deploy.yml offers
      # a macos platform, so a Mac build that has silently rotted is a release
      # that fails at the archive step.
      - name: macOS build
        working-directory: MasonsBudget
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MasonsBudget.xcodeproj \
            -scheme MasonsBudgetMac \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      # Only on failure. The xcresult carries the per-test failure detail that
      # the raw xcodebuild log buries, and on a green run it is dead weight
      # nobody opens.
      - name: Upload the test result bundle
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: masonsbudget-ios-xcresult
          path: ${{ runner.temp }}/MasonsBudget-iOS.xcresult
          retention-days: 7
          if-no-files-found: ignore
