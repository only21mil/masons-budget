// Resolve external inputs without compiling, testing, signing or assembling.
// Resolution failure leaves the ordinary CI checks enabled.
import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

def hashFile = { file ->
    def hash = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        for (int count = input.read(buffer); count >= 0; count = input.read(buffer)) {
            if (count > 0) hash.update(buffer, 0, count)
        }
    }
    hash.digest().encodeHex().toString()
}
def hashArtifact = { file ->
    if (!file.isDirectory()) return hashFile(file)
    def entries = new TreeMap()
    file.eachFileRecurse { child ->
        if (child.isFile()) entries[file.toPath().relativize(child.toPath()).toString()] = hashFile(child)
    }
    MessageDigest.getInstance('SHA-256').digest(JsonOutput.toJson(entries).getBytes('UTF-8')).encodeHex().toString()
}

gradle.projectsEvaluated {
    def projectRoot = gradle.rootProject
    if (!gradle.startParameter.taskNames.any { it in ['ciReuseDependencies', ':ciReuseDependencies'] }) return
    def output = new File(System.getenv('RUNNER_TEMP'), 'budget-gradle-context.json')
    if (output.exists() && !output.delete()) throw new GradleException('Cannot clear previous dependency proof')
    if (!(gradle.startParameter.taskNames in [['ciReuseDependencies'], [':ciReuseDependencies']])) {
        throw new GradleException('Dependency collection requires an exclusive ciReuseDependencies invocation')
    }
    // Let Gradle realize the same lazy task configurations as the protected
    // checks. Disable every other planned task, including finalizers, before
    // execution so graph discovery never compiles, tests or runs lint.
    def requiredTasks = [':domain:test', ':app:lintDebug', ':app:testDebugUnitTest']
    gradle.taskGraph.whenReady { graph ->
        if (!requiredTasks.every { graph.hasTask(it) }) throw new GradleException('Protected task graph incomplete')
        graph.allTasks.findAll { it.path != ':ciReuseDependencies' }.each { it.enabled = false }
    }
    projectRoot.tasks.register('ciReuseDependencies') {
        dependsOn requiredTasks
        doLast {
            def artifacts = new TreeMap()
            def configurations = new TreeMap()
            def excludedMetadata = new TreeMap()
            def taskToolClasspaths = new TreeMap()
            def protectedTasks = gradle.taskGraph.allTasks.findAll { it.path != ':ciReuseDependencies' }
            protectedTasks.findAll { it.hasProperty('lintTool') }.each { task ->
                // AGP's lint engine uses a detached configuration, absent from
                // project.configurations. Resolve the actual consumed classpath
                // transitively and preserve its order, rather than trusting
                // incidental engine bytes in a warm plugin cache.
                def files = task.lintTool.classpath.files
                if (files.isEmpty()) throw new GradleException("Lint tool classpath missing for ${task.path}")
                taskToolClasspaths[task.path] = files.collect { file ->
                    [name: file.name, sha256: hashArtifact(file)]
                }
            }
            if (taskToolClasspaths.isEmpty()) throw new GradleException('Protected lint tool classpaths missing')
            projectRoot.allprojects.sort { it.path }.each { project ->
                def jvmProject = (project.pluginManager.hasPlugin('org.jetbrains.kotlin.android') ||
                    project.pluginManager.hasPlugin('org.jetbrains.kotlin.jvm')) &&
                    !project.pluginManager.hasPlugin('org.jetbrains.kotlin.multiplatform')
                project.configurations.findAll { it.canBeResolved }.sort { it.name }.each { config ->
                    def attributes = new TreeMap()
                    config.attributes.keySet().each { key ->
                        attributes[key.name] = config.attributes.getAttribute(key).toString()
                    }
                    // Kotlin's per-source-set IDE metadata buckets are not JVM
                    // task classpaths. A debug-only bucket can lack the main
                    // Compose BOM; the Android compile/runtime paths inherit it.
                    // Keep every other configuration strict, including tools.
                    if (jvmProject && config.name.endsWith('DependenciesMetadata') &&
                        attributes['org.gradle.usage'] == 'kotlin-metadata' &&
                        attributes['org.jetbrains.kotlin.platform.type'] == 'common' &&
                        attributes['org.gradle.category'] == 'library') {
                        excludedMetadata["${project.path}:${config.name}".toString()] = attributes
                        return
                    }
                    def resolved = config.incoming.artifactView {
                        componentFilter { id -> id instanceof ModuleComponentIdentifier }
                    }.artifacts.artifacts
                    def names = []
                    resolved.each { artifact ->
                        def key = "${artifact.id.componentIdentifier.displayName}/${artifact.file.name}".toString()
                        def hash = hashArtifact(artifact.file)
                        if (artifacts.containsKey(key) && artifacts[key] != hash) {
                            throw new GradleException('Conflicting resolved artifact identity')
                        }
                        artifacts[key] = hash
                        names.add(key)
                    }
                    configurations["${project.path}:${config.name}".toString()] = names.sort()
                }
            }
            // Include settings/build plugins as well as application dependencies.
            def pluginCache = new File(gradle.gradleUserHomeDir, 'caches/modules-2/files-2.1')
            def cached = new TreeMap()
            pluginCache.eachFileRecurse { file ->
                if (file.isFile()) cached[pluginCache.toPath().relativize(file.toPath()).toString()] = hashFile(file)
            }
            def sdk = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
            if (!sdk) throw new GradleException('Android SDK identity missing')
            def packages = new TreeMap()
            new File(sdk).eachFileRecurse { file ->
                if (file.name == 'source.properties') packages[new File(sdk).toPath().relativize(file.toPath()).toString()] = hashFile(file)
            }
            if (artifacts.isEmpty() || cached.isEmpty() || packages.isEmpty()) {
                throw new GradleException('Resolved dependency context is incomplete')
            }
            output.text = JsonOutput.toJson([
                schema: 1, gradle: gradle.gradleVersion,
                artifacts: artifacts, configurations: configurations,
                protectedTasks: protectedTasks*.path.sort(), taskToolClasspaths: taskToolClasspaths,
                excludedMetadata: excludedMetadata, pluginCache: cached, sdkPackages: packages
            ]) + '\n'
        }
    }
}
